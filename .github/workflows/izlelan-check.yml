name: İzlelan integration checks
on:
  push:
    branches: [feature/izlelan-ace-clover-dragon, feature/izlelan-all-providers]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check providers/vod.js
      - run: node --check providers/izlelan-adapter.js
      - run: node tests/izlelan-adapter.test.js
        env:
          REQUIRE_IZLELAN_PROVIDERS: '1'
      - run: node tests/izlelan-live-probe.js
        timeout-minutes: 2
