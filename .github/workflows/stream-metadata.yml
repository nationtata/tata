name: Shared stream metadata
on:
  push:
    branches: [feature/shared-stream-metadata]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check providers/vod.js && node --check addon.js && node tests/stream-metadata.test.js && node tests/content-identity.test.js
