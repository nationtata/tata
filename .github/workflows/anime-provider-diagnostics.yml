name: Anime provider diagnostics
on:
  push:
    branches: [test/anime-provider-diagnostics]
  workflow_dispatch:
jobs:
  anime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node tests/anime-provider-diagnostics.js
        timeout-minutes: 10
