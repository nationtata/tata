<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TATA Hub</title>

<style>
body{
margin:0;
background:#000;
color:white;
font-family:Arial,sans-serif;
}

#backdrop{
width:100%;
height:320px;
background-size:cover;
background-position:center;
position:relative;
}

#overlay{
position:absolute;
inset:0;
background:linear-gradient(180deg,transparent,#000);
}

#content{
padding:24px;
}

#logo{
height:72px;
margin-top:-36px;
position:relative;
z-index:2;
}

.row{
display:flex;
overflow-x:auto;
gap:14px;
padding-bottom:10px;
}

.card{
min-width:150px;
}

.card img{
width:150px;
border-radius:10px;
display:block;
}
</style>

</head>
<body>

<div id="backdrop">
<div id="overlay"></div>
</div>

<div id="content">

<img id="logo"/>

<h1 id="title"></h1>

<p id="desc"></p>

<h2>Popüler Diziler</h2>

<div id="popular" class="row"></div>

</div>

<script>

const params=new URLSearchParams(location.search);

const channel=params.get("channel")||"TRT 1";

async function load(){

const hub=await fetch(`/hub/${encodeURIComponent(channel)}.json`)
.then(r=>r.json());

const h=hub.hub;

document.getElementById("title").textContent=h.name;

document.getElementById("logo").src=h.logo;

document.getElementById("desc").textContent=
h.tmdb?.headquarters||"";

const bg=h.tmdb?.logo_path
?`https://image.tmdb.org/t/p/original${h.tmdb.logo_path}`
:h.poster;

document.getElementById("backdrop").style.backgroundImage=`url('${bg}')`;

const popular=document.getElementById("popular");

for(const item of h.featured){

const card=document.createElement("div");

card.className="card";

card.innerHTML=`
<img src="https://via.placeholder.com/300x450/111111/FFFFFF?text=${encodeURIComponent(item)}">
<p>${item}</p>
`;

popular.appendChild(card);

}

}

load();

</script>

</body>
</html>
