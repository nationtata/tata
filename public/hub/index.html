<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TATA Hub</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
overflow-x:hidden;
}

#hero{
height:42vh;
min-height:320px;
background-size:cover;
background-position:center;
position:relative;
}

#hero::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(180deg,transparent,#000 90%);
}

#content{
margin-top:-70px;
position:relative;
z-index:5;
padding:0 36px 40px;
}

#logo{
height:88px;
display:block;
margin-bottom:20px;
}

#title{
font-size:42px;
font-weight:bold;
margin:0;
}

#desc{
margin-top:12px;
color:#cfcfcf;
max-width:900px;
line-height:1.5;
}

button.watch{
margin-top:24px;
padding:14px 26px;
border:none;
border-radius:10px;
background:white;
color:black;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.section{
margin-top:42px;
}

.section h2{
margin-bottom:18px;
font-size:28px;
}

.row{
display:flex;
gap:18px;
overflow-x:auto;
padding-bottom:12px;
scroll-behavior:smooth;
}

.row::-webkit-scrollbar{
display:none;
}

.card{
min-width:170px;
max-width:170px;
transition:.18s;
cursor:pointer;
}

.card:focus{
outline:none;
transform:scale(1.05);
}

.card img{
width:170px;
height:255px;
object-fit:cover;
border-radius:12px;
background:#111;
}

.card p{
margin:10px 0 0;
font-size:15px;
font-weight:600;
line-height:1.35;
}

.meta{
margin-top:14px;
color:#aaa;
font-size:14px;
display:flex;
gap:20px;
flex-wrap:wrap;
}

@media (max-width:700px){

#content{
padding:0 20px 30px;
}

#title{
font-size:30px;
}

#logo{
height:62px;
}

.card{
min-width:135px;
max-width:135px;
}

.card img{
width:135px;
height:202px;
}

}

</style>
</head>

<body>

<div id="hero"></div>

<div id="content">

<img id="logo">

<h1 id="title"></h1>

<div class="meta">
<span id="group"></span>
<span id="country"></span>
</div>

<p id="desc"></p>

<button class="watch" id="watchBtn">
▶ Canlı Yayını İzle
</button>

<div class="section">

<h2>Popüler Diziler</h2>

<div id="popular" class="row"></div>

</div>

<div class="section">

<h2>Yeni Diziler</h2>

<div id="newest" class="row"></div>

</div>

</div>

<script>

const params=new URLSearchParams(location.search);

const channel=params.get("channel")||"TRT 1";

async function loadHub(){

const data=await fetch(
`/hub/${encodeURIComponent(channel)}.json`
).then(r=>r.json());

const hub=data.hub;

document.getElementById("title").textContent=hub.name;

document.getElementById("group").textContent=hub.group;

document.getElementById("country").textContent="Türkiye";

document.getElementById("desc").textContent=hub.description||"";

document.getElementById("logo").src=hub.logo;

document.getElementById("hero").style.backgroundImage=
`url('${hub.backdrop}')`;

fillRow("popular",hub.popular);

fillRow("newest",hub.newest);

}

function fillRow(id,list){

const row=document.getElementById(id);

row.innerHTML="";

for(const item of list){

const card=document.createElement("div");

card.className="card";

card.tabIndex=0;

card.innerHTML=`
<img src="${item.poster||''}">
<p>${item.name}</p>
`;

card.onclick=()=>{
window.open(
`https://www.themoviedb.org/tv/${item.id}?language=tr`,
"_blank"
);
};

row.appendChild(card);

}

}

document.getElementById("watchBtn").onclick=()=>{
history.back();
};

loadHub();

</script>

</body>
</html>
