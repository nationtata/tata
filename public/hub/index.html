<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>TATA Hub</title>

<link rel="preconnect" href="https://image.tmdb.org">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{

background:#050505;
color:white;
overflow-x:hidden;

}

/* HERO */

.hero{

position:relative;

height:72vh;
min-height:520px;

display:flex;
align-items:flex-end;

padding:60px;

background-size:cover;
background-position:center;

}

.hero::before{

content:"";

position:absolute;
inset:0;

background:
linear-gradient(to top,#050505 0%,rgba(5,5,5,.35) 60%,rgba(5,5,5,.05));

}

.hero-content{

position:relative;
z-index:2;
max-width:760px;

}

.logo{

height:110px;
margin-bottom:25px;

object-fit:contain;

}

.live{

display:inline-flex;
align-items:center;
gap:10px;

background:#d40000;

padding:9px 18px;

border-radius:999px;

font-weight:700;
font-size:15px;

margin-bottom:20px;

}

.live-dot{

width:10px;
height:10px;

border-radius:50%;

background:white;

animation:pulse 1.2s infinite;

}

@keyframes pulse{

0%{transform:scale(1);}
50%{transform:scale(1.35);}
100%{transform:scale(1);}

}

.title{

font-size:58px;
margin-bottom:14px;

}

.desc{

font-size:19px;
line-height:1.65;

color:#d7d7d7;

margin-bottom:30px;

}

.actions{

display:flex;
gap:16px;
flex-wrap:wrap;

}

.btn{

padding:16px 32px;

border:none;

border-radius:14px;

cursor:pointer;

font-size:17px;
font-weight:700;

transition:.22s;

}

.primary{

background:white;
color:black;

}

.primary:hover{

transform:translateY(-2px);

}

.secondary{

background:rgba(255,255,255,.12);

color:white;

backdrop-filter:blur(12px);

}

.secondary:hover{

background:rgba(255,255,255,.18);

}

/* CONTENT */

.content{

padding:42px;

}

.info-grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:20px;

margin-bottom:44px;

}

.card{

background:#121212;

border-radius:18px;

padding:22px;

border:1px solid rgba(255,255,255,.06);

}

.card small{

display:block;

color:#8f8f8f;

margin-bottom:10px;

}

.card strong{

font-size:22px;

}

.row{

margin-bottom:42px;

}

.row-title{

font-size:28px;

margin-bottom:18px;

}

.carousel{

display:flex;

gap:18px;

overflow-x:auto;

padding-bottom:12px;

scrollbar-width:none;

}

.carousel::-webkit-scrollbar{

display:none;

}

/* POSTER */

.poster{

flex:0 0 180px;

height:270px;

border-radius:18px;

overflow:hidden;

position:relative;

background:#1a1a1a;

transition:.22s;

cursor:pointer;

}

.poster:hover{

transform:scale(1.04);

}

.poster:focus{

outline:none;

box-shadow:0 0 0 3px white;

transform:scale(1.05);

}

.poster img{

width:100%;
height:100%;

object-fit:cover;

}

.poster-title{

position:absolute;

left:12px;
right:12px;
bottom:12px;

font-size:14px;
font-weight:700;

text-shadow:0 3px 12px black;

}

/* SKELETON */

.skeleton{

background:#181818;

overflow:hidden;

}

.skeleton::after{

content:"";

position:absolute;
inset:0;

background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,.08),
transparent);

animation:shine 1.2s infinite;

}

@keyframes shine{

0%{transform:translateX(-100%);}
100%{transform:translateX(100%);}

}

/* FOOTER */

.footer{

padding:28px;

text-align:center;

color:#777;

font-size:14px;

}

/* MOBILE */

@media(max-width:768px){

.hero{

padding:28px;

height:64vh;
min-height:420px;

}

.logo{

height:78px;

}

.title{

font-size:38px;

}

.desc{

font-size:16px;

}

.content{

padding:24px;

}

.poster{

flex-basis:145px;

height:220px;

}

}

</style>

</head>

<body>

<section id="hero" class="hero">

<div class="hero-content">

<div class="live">

<div class="live-dot"></div>

CANLI

</div>

<img
id="logo"
class="logo"
src=""
alt="Logo">

<h1 id="title" class="title">
Yükleniyor...
</h1>

<p id="description" class="desc">
Kanal bilgileri yükleniyor...
</p>

<div class="actions">

<button id="watchBtn" class="btn primary">

▶ Canlı İzle

</button>

<button class="btn secondary">

ℹ Kanal Bilgisi

</button>

</div>

</div>

</section>

<div class="content">

<div class="info-grid">

<div class="card">

<small>ŞU AN YAYINDA</small>

<strong id="nowPlaying">
Yükleniyor...
</strong>

</div>

<div class="card">

<small>SIRADAKİ PROGRAM</small>

<strong id="nextPlaying">
Yükleniyor...
</strong>

</div>

<div class="card">

<small>KATEGORİ</small>

<strong id="category">
-
</strong>

</div>

</div>

<div class="row">

<h2 class="row-title">
Popüler Diziler
</h2>

<div id="popular" class="carousel">

<div class="poster skeleton"></div>
<div class="poster skeleton"></div>
<div class="poster skeleton"></div>
<div class="poster skeleton"></div>
<div class="poster skeleton"></div>
<div class="poster skeleton"></div>

</div>

</div>

<div class="row">

<h2 class="row-title">
Yeni Diziler
</h2>

<div id="newest" class="carousel">

<div class="poster skeleton"></div>
<div class="poster skeleton"></div>
<div class="poster skeleton"></div>
<div class="poster skeleton"></div>
<div class="poster skeleton"></div>
<div class="poster skeleton"></div>

</div>

</div>

</div>

<div class="footer">

TATA Premium Hub • TMDb Destekli

</div>

<script src="/hub/app.js"></script>

</body>
</html>
