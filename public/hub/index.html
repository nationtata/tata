<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>TATA Hub</title>

<link rel="preconnect" href="https://image.tmdb.org">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{

background:#050505;
color:white;
overflow-x:hidden;

}

/* ================= HERO ================= */

.hero{

position:relative;
height:72vh;
min-height:520px;

display:flex;
align-items:flex-end;

padding:60px;

background-size:cover;
background-position:center;

}

.hero::before{

content:"";

position:absolute;
inset:0;

background:
linear-gradient(to top,#050505 0%,rgba(5,5,5,.35) 60%,rgba(5,5,5,.05));

}

.hero-content{

position:relative;
z-index:2;
max-width:760px;

}

.logo{

height:110px;
margin-bottom:25px;
object-fit:contain;

}

.live{

display:inline-flex;
align-items:center;
gap:10px;

background:#D40000;

padding:9px 18px;

border-radius:999px;

font-weight:700;

font-size:15px;

margin-bottom:20px;

}

.live-dot{

width:10px;
height:10px;
border-radius:50%;
background:white;

animation:pulse 1.3s infinite;

}

@keyframes pulse{

0%{transform:scale(1);}
50%{transform:scale(1.35);}
100%{transform:scale(1);}

}

h1{

font-size:58px;
margin-bottom:12px;

}

.desc{

font-size:19px;
line-height:1.65;
color:#d8d8d8;

margin-bottom:32px;

}

.actions{

display:flex;
gap:16px;
flex-wrap:wrap;

}

.btn{

padding:16px 32px;

border:none;
border-radius:14px;

cursor:pointer;

font-size:17px;
font-weight:700;

transition:.22s;

}

.primary{

background:white;
color:black;

}

.primary:hover{

transform:translateY(-2px);

}

.secondary{

background:rgba(255,255,255,.12);
color:white;

backdrop-filter:blur(10px);

}

.secondary:hover{

background:rgba(255,255,255,.18);

}

/* ================= CONTENT ================= */

.content{

padding:40px;

}

.info-grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:22px;

margin-bottom:46px;

}

.card{

background:#121212;

border-radius:18px;

padding:22px;

border:1px solid rgba(255,255,255,.05);

}

.card small{

color:#9c9c9c;
display:block;
margin-bottom:10px;

}

.card strong{

font-size:22px;

}

/* ================= ROWS ================= */

.row{

margin-bottom:42px;

}

.row-title{

font-size:27px;
margin-bottom:18px;

}

.carousel{

display:flex;
gap:18px;

overflow-x:auto;

padding-bottom:12px;

scrollbar-width:none;

}

.carousel::-webkit-scrollbar{

display:none;

}

.poster{

flex:0 0 180px;

height:270px;

border-radius:18px;

background:#1a1a1a;

overflow:hidden;

position:relative;

transition:.25s;

}

.poster:hover{

transform:scale(1.04);

}

.poster img{

width:100%;
height:100%;
object-fit:cover;

}

.poster-title{

position:absolute;
left:12px;
right:12px;
bottom:12px;

font-size:14px;
font-weight:600;

text-shadow:0 3px 12px black;

}

/* ================= FOOTER ================= */

.footer{

padding:30px 40px;

color:#7d7d7d;

font-size:14px;

text-align:center;

}

/* ================= MOBILE ================= */

@media(max-width:768px){

.hero{

padding:28px;
height:65vh;
min-height:430px;

}

.logo{

height:78px;

}

h1{

font-size:38px;

}

.desc{

font-size:16px;

}

.content{

padding:24px;

}

.poster{

flex-basis:145px;
height:220px;

}

}

</style>

</head>

<body>

<section id="hero" class="hero">

<div class="hero-content">

<div class="live">
<div class="live-dot"></div>
CANLI
</div>

<img id="logo" class="logo" src="" alt="Logo">

<h1 id="title">TRT 1</h1>

<p id="description" class="desc">
Türkiye'nin ulusal televizyon kanalı.
</p>

<div class="actions">

<button id="watchBtn" class="btn primary">
▶ Canlı İzle
</button>

<button class="btn secondary">
ℹ Kanal Bilgisi
</button>

</div>

</div>

</section>

<div class="content">

<div class="info-grid">

<div class="card">
<small>ŞU AN YAYINDA</small>
<strong id="nowPlaying">Yükleniyor...</strong>
</div>

<div class="card">
<small>SIRADAKİ PROGRAM</small>
<strong id="nextPlaying">Yükleniyor...</strong>
</div>

<div class="card">
<small>KATEGORİ</small>
<strong id="category">Ulusal</strong>
</div>

</div>

<div class="row">

<h2 class="row-title">
🔥 Popüler Diziler
</h2>

<div id="popular" class="carousel"></div>

</div>

<div class="row">

<h2 class="row-title">
🆕 Yeni Diziler
</h2>

<div id="newest" class="carousel"></div>

</div>

</div>

<div class="footer">
TATA Premium Hub
</div>

<script>

const channel =
new URLSearchParams(location.search)
.get("channel") || "TRT 1";

async function loadHub(){

const res=await fetch(`/hub/${encodeURIComponent(channel)}.json`);

const data=await res.json();

const hub=data.hub;

if(!hub)return;

document.title=`${hub.name} • TATA`;

document.getElementById("title").textContent=hub.name;

document.getElementById("description").textContent=
hub.description;

document.getElementById("logo").src=hub.logo;

document.getElementById("hero").style.backgroundImage=
`url(${hub.backdrop||hub.poster})`;

document.getElementById("category").textContent=
hub.group;

render("popular",hub.popular||[]);

render("newest",hub.newest||[]);

}

function render(id,list){

const row=document.getElementById(id);

row.innerHTML="";

list.forEach(item=>{

const card=document.createElement("div");

card.className="poster";

card.innerHTML=`
<img src="${item.poster}">
<div class="poster-title">${item.name}</div>
`;

row.appendChild(card);

});

}

loadHub();

</script>

</body>
</html>
